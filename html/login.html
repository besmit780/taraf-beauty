<body>
<header class="site-header"><div class="header-inner"><h1 class="brand-name">ترف بيوتي</h1></div></header>
<nav class="main-nav">

    <li><a href="../index.html">الرئيسية</a></li>

<main class="container">
  <div class="page-title">
    <h2>تسجيل الدخول</h2>
    <p>تسجيل الدخول إلى ترف بيوتي</p>
  </div>

  <section class="section-card form-card">
    <form id="loginForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">البريد الإلكتروني</label>
        <input class="form-control" id="loginEmail" type="email" required>
        <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صحيح.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">كلمة المرور</label>
        <input class="form-control" id="loginPassword" type="password" minlength="6" required>
        <div class="invalid-feedback">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</div>
      </div>
      <button class="btn btn-dark" type="submit">دخول</button>
    </form>
  </section>
</main>

<footer class="site-footer"><p>ترف بيوتي</p></footer>

<script src="../libs/jquery/jquery.min.js"></script>
<script src="../libs/bootstrap/bootstrap.bundle.min.js"></script>

</body>
